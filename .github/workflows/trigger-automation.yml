name: Trigger Automation Repository

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  trigger:

    runs-on: ubuntu-latest

    steps:

      - name: Trigger Automation Repository

        env:
          ORG_TOKEN: ${{ secrets.ORG_TOKEN }}

        run: |

          echo "=========================================="
          echo "Triggering Automation Repository"
          echo "=========================================="

          response=$(curl \
            --silent \
            --write-out "%{http_code}" \
            --output /tmp/dispatch_response.txt \
            --request POST \
            --url https://api.github.com/repos/Xebia-Takshashila-III-AIML-B-Projects/automation/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${ORG_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"event_type":"sync-template"}')

          echo ""
          echo "HTTP Status : $response"
          echo ""

          if [ "$response" != "204" ]; then

            echo "=========================================="
            echo "Dispatch Failed"
            echo "=========================================="

            cat /tmp/dispatch_response.txt

            exit 1

          fi

          echo "=========================================="
          echo "Automation Repository Triggered Successfully"
          echo "=========================================="
